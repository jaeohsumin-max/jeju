<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>애월 귤담 카페</title>
<style>
  :root{--orange:#ff8a1f;--orange-d:#e56f00;--orange-l:#fff1e0;--ink:#3a2a1a}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:1.15rem;line-height:1.7;display:flex;justify-content:center}
  main{width:100%;max-width:520px}
  .hero{background:var(--orange);color:#fff;text-align:center;padding:56px 20px 48px;border-radius:0 0 36px 36px}
  .hero .icon{font-size:3.6rem}
  .hero h1{margin:6px 0 4px;font-size:2.4rem;line-height:1.25}
  .hero p{margin:0;font-size:1.15rem;opacity:.95}
  section{padding:36px 20px 8px}
  h2{margin:0 0 16px;font-size:1.7rem;color:var(--orange-d)}
  .menu{display:flex;gap:14px;align-items:center;background:var(--orange-l);border-radius:20px;padding:18px;margin-bottom:14px}
  .menu .e{font-size:2.6rem;flex:none}
  .menu h3{margin:0;font-size:1.3rem}
  .menu p{margin:2px 0 0;font-size:1rem;color:#6b5540}
  .menu .price{margin-left:auto;font-weight:800;color:var(--orange-d);white-space:nowrap}
  .road{border:2px solid var(--orange);border-radius:20px;padding:18px}
  .road p{margin:0 0 10px}
  .road b{color:var(--orange-d)}
  .btn{display:block;text-align:center;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;
    font-size:1.2rem;padding:16px;border-radius:999px;margin-top:14px}
  footer{text-align:center;padding:28px 20px 40px;color:#8a7560;font-size:.95rem}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="icon">🍊</div>
    <h1>애월 귤담 카페</h1>
    <p>제주 애월 바닷가의 작은 카페</p>
  </div>

  <section>
    <h2>대표 메뉴</h2>
    <div class="menu"><span class="e">🍋</span><div><h3>한라봉 에이드</h3><p>상큼한 한라봉과 탄산</p></div><span class="price">6,500원</span></div>
    <div class="menu"><span class="e">🥜</span><div><h3>우도 땅콩 라떼</h3><p>고소한 우도 땅콩 크림</p></div><span class="price">6,000원</span></div>
    <div class="menu"><span class="e">🥐</span><div><h3>감귤 스콘</h3><p>귤 향이 가득한 구움과자</p></div><span class="price">4,500원</span></div>
  </section>

  <section>
    <h2>오시는 길</h2>
    <div class="road">
      <p><b>📍 주소</b><br>제주시 애월읍 ○○로 123</p>
      <p><b>🕘 영업시간</b><br>매일 10:00 – 20:00</p>
      <p><b>📞 전화</b><br>064-000-0000</p>
      <p style="margin:0"><b>🚗 안내</b><br>카페 앞 주차 가능 · 바다 바로 앞</p>
    </div>
    <a class="btn" href="tel:064-000-0000">전화하기</a>
  </section>

  <footer>© 애월 귤담 카페</footer>
</main>
</body>
</html>
